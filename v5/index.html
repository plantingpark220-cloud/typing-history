<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpellCraft Typing 鍵盤魔導士</title>
  <style>
    :root {
      --bg-color: #0d0e15;
      --panel-bg: rgba(22, 26, 42, 0.85);
      --border-gold: #c9a050;
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --text-gold: #fef08a;
      --text-main: #f1f5f9;
      --danger: #ef4444;
      --boss-hp: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #090a0f 70%);
      padding: 10px;
    }
    header {
      width: 100%;
      max-width: 900px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 2px solid var(--border-gold);
      border-radius: 12px 12px 0 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .title { font-size: 15px; font-weight: bold; color: var(--text-gold); text-shadow: 0 0 10px rgba(201,160,80,0.5); }
    .hud { display: flex; gap: 10px; font-size: 13px; }
    .hud-val { color: var(--accent-blue); font-weight: bold; }
    
    #game-canvas {
      width: 100%;
      max-width: 900px;
      height: 360px;
      background: rgba(10, 12, 24, 0.85);
      border-left: 2px solid var(--border-gold);
      border-right: 2px solid var(--border-gold);
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
    }

    #boss-container {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 6;
    }
    .boss-sprite { font-size: 42px; filter: drop-shadow(0 0 12px #ef4444); animation: bossFloat 2s infinite alternate ease-in-out; }
    .boss-bar-bg { width: 220px; height: 14px; background: rgba(0,0,0,0.7); border: 1.5px solid var(--border-gold); border-radius: 7px; overflow: hidden; }
    .boss-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ef4444, #f97316); transition: width 0.2s; }
    .boss-name { font-size: 13px; color: #fca5a5; font-weight: bold; text-shadow: 0 0 4px #000; letter-spacing: 1px; }

    @keyframes bossFloat {
      from { transform: translateY(0); }
      to { transform: translateY(8px); }
    }

    #mage-staff-container {
      position: absolute;
      bottom: -10px;
      left: 50%;
      width: 60px;
      height: 100px;
      margin-left: -30px;
      z-index: 5;
      transform-origin: bottom center;
      transition: transform 0.15s ease-out;
      pointer-events: none;
    }
    .staff-orb {
      width: 24px;
      height: 24px;
      background: radial-gradient(circle, #e0f2fe 10%, #0284c7 60%, #0369a1 100%);
      border-radius: 50%;
      position: absolute;
      top: 10px;
      left: 18px;
      box-shadow: 0 0 15px #38bdf8, 0 0 25px #0284c7;
      animation: orbGlow 1.5s infinite alternate;
    }
    .staff-head {
      width: 40px;
      height: 35px;
      border: 3px solid #334155;
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      position: absolute;
      top: 5px;
      left: 10px;
      box-shadow: inset 0 0 5px #000;
    }
    .staff-handle {
      width: 6px;
      height: 65px;
      background: linear-gradient(to bottom, #1e293b, #0f172a);
      position: absolute;
      top: 35px;
      left: 27px;
      border-radius: 3px;
    }

    @keyframes orbGlow {
      from { box-shadow: 0 0 10px #38bdf8; }
      to { box-shadow: 0 0 22px #38bdf8, 0 0 30px #60a5fa; }
    }

    .fireball-container {
      position: absolute;
      min-width: 60px;
      height: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .fire-tail {
      width: 24px;
      height: 30px;
      background: linear-gradient(to top, rgba(249, 115, 22, 0.9), rgba(239, 68, 68, 0.6), transparent);
      border-radius: 50% 50% 20% 20%;
      filter: blur(2px);
      animation: flameFlicker 0.2s infinite alternate;
      margin-bottom: -10px;
    }
    .fireball-head {
      min-width: 52px;
      height: 48px;
      padding: 0 16px;
      background: radial-gradient(circle, #fff7ed 10%, #f97316 50%, #dc2626 90%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #0f172a;
      box-shadow: 0 0 15px #f97316, 0 0 30px #ef4444;
      border: 2px solid #ffedd5;
      text-shadow: 0 0 3px #fff;
      z-index: 2;
      letter-spacing: 1.5px;
      white-space: nowrap;
    }
    .typed-char { color: #22c55e; text-shadow: 0 0 5px #4ade80; font-weight: 900; }

    @keyframes flameFlicker {
      0% { transform: scaleX(0.9) scaleY(1); opacity: 0.8; }
      100% { transform: scaleX(1.1) scaleY(1.2); opacity: 1; }
    }

    .water-orb {
      position: absolute;
      width: 22px;
      height: 22px;
      background: radial-gradient(circle, #ffffff 20%, #38bdf8 60%, #0284c7 100%);
      border-radius: 50%;
      box-shadow: 0 0 15px #38bdf8, 0 0 25px #0284c7;
      z-index: 4;
      pointer-events: none;
    }

    .explosion {
      position: absolute;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #38bdf8 40%, #f97316 70%, transparent 100%);
      transform: translate(-50%, -50%) scale(0.2);
      animation: explode 0.3s ease-out forwards;
      pointer-events: none;
      z-index: 6;
    }

    @keyframes explode {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
      50% { opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
    }

    .keyboard {
      width: 100%;
      max-width: 900px;
      background: var(--panel-bg);
      border: 2px solid var(--border-gold);
      border-radius: 0 0 12px 12px;
      padding: 10px 5px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .key-row { display: flex; justify-content: center; gap: 4px; }
    .key {
      flex: 1;
      max-width: 45px;
      height: 45px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(201,160,80,0.4);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      color: #94a3b8;
      transition: all 0.1s ease;
      cursor: pointer;
    }
    .key.active {
      background: var(--border-gold);
      color: #000;
      box-shadow: 0 0 15px var(--text-gold);
      transform: scale(0.92);
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 14, 21, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      z-index: 10;
    }
    .btn {
      padding: 12px 32px;
      background: linear-gradient(135deg, #c9a050, #8e5225);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(201,160,80,0.4);
      transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.95); }

    .heatmap-box {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-gold);
      border-radius: 8px;
      padding: 10px 15px;
      width: 85%;
      max-width: 400px;
      font-size: 12px;
      text-align: left;
    }
    .heatmap-tag {
      display: inline-block;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 2px 6px;
      border-radius: 4px;
      margin: 2px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">✨ SpellCraft Typing</div>
    <div class="hud">
      <div>HP: <span id="hp-val" class="hud-val" style="color:var(--danger);">100</span></div>
      <div>WPM: <span id="wpm-val" class="hud-val">0</span></div>
      <div>ACC: <span id="acc-val" class="hud-val">100%</span></div>
      <div>分: <span id="score-val" class="hud-val">0</span></div>
      <div>關: <span id="level-val" class="hud-val">1/5</span></div>
    </div>
  </header>

  <div id="game-canvas">
    <div id="boss-container">
      <div class="boss-name">🐉 魔龍 (BOSS)</div>
      <div class="boss-bar-bg"><div class="boss-bar-fill" id="boss-hp-fill"></div></div>
      <div class="boss-sprite">🐉</div>
    </div>

    <div id="mage-staff-container">
      <div class="staff-head"></div>
      <div class="staff-orb"></div>
      <div class="staff-handle"></div>
    </div>
    
    <div id="start-screen" class="overlay">
      <h1 style="color: var(--text-gold); font-size: 24px;">魔法學院鍵盤試煉</h1>
      <p style="color: #94a3b8; font-size: 13px; text-align: center; padding: 0 20px;">
        揮舞水元素法杖擊退烈焰火球！<br><b>Stage 1： Home Row 基準鍵特訓（ASDFGHJKL;）</b>
      </p>
      <button class="btn" id="start-btn">開始詠唱試煉</button>
    </div>

    <div id="level-up-screen" class="overlay" style="display: none;">
      <h1 style="color: #38bdf8; font-size: 24px;">✨ 關卡突破！</h1>
      <p style="color: #fef08a; font-size: 18px; margin-top: 5px;" id="rank-title-text"></p>
      <p style="color: #94a3b8; font-size: 14px; text-align: center; max-width: 80%;" id="level-up-desc"></p>
      <button class="btn" id="next-level-btn">進入下一關</button>
    </div>

    <div id="gameover-screen" class="overlay" style="display: none;">
      <h1 id="end-title" style="color: var(--text-gold); font-size: 22px;">試煉結果</h1>
      <p id="end-desc" style="color: #94a3b8; font-size: 13px; text-align: center;"></p>
      
      <div class="heatmap-box" id="heatmap-panel">
        <div style="color:var(--text-gold); font-weight:bold; margin-bottom:5px;">📊 學習效益與錯字熱點分析 (Heatmap)</div>
        <div id="heatmap-content" style="color:#cbd5e1;">系統分析中...</div>
      </div>

      <button class="btn" id="restart-btn">重新嘗試</button>
    </div>
  </div>

  <div class="keyboard" id="virtual-keyboard"></div>

  <script>
    const keysLayout = [
      ["Q","W","E","R","T","Y","U","I","O","P"],
      ["A","S","D","F","G","H","J","K","L",";"],
      ["Z","X","C","V","B","N","M"]
    ];

    // 升級的高階專有名詞與魔法組合咒語
    const levelKeyPool = {
      1: ["A","S","D","F","G","H","J","K","L",";"],
      2: ["Q","W","E","R","T","Y","U","I","O","P"],
      3: ["Z","X","C","V","B","N","M"],
      4: ["blizzard", "lightning", "explosion", "avalanche", "sanctuary", "meteorite", "hurricane", "elemental"],
      5: ["cumulonimbus", "water splash", "icicle edge", "flood flash", "icicle field", "ice smash", "absolute zero", "frost breath"]
    };

    function initKeyboard() {
      const container = document.getElementById('virtual-keyboard');
      container.innerHTML = '';
      keysLayout.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'key-row';
        row.forEach(k => {
          const keyDiv = document.createElement('div');
          keyDiv.className = 'key';
          keyDiv.id = `key-${k === ';' ? 'semicolon' : k}`;
          keyDiv.innerText = k;

          const handleInput = (e) => {
            e.preventDefault();
            handleKeyPress(k);
          };
          keyDiv.addEventListener('touchstart', handleInput, { passive: false });
          keyDiv.addEventListener('click', handleInput);

          rowDiv.appendChild(keyDiv);
        });
        container.appendChild(rowDiv);
      });
    }

    let hp = 100, score = 0, levelScore = 0, combo = 0, level = 1, levelHits = 0, isPlaying = false;
    let bossHp = 100, maxBossHp = 100;
    let enemies = [];
    let waterSpells = [];
    let activeTarget = null;
    let lastSpawnedWord = "";
    let gameInterval = null, spawnInterval = null;

    let totalKeystrokes = 0, correctKeystrokes = 0, startTime = null;
    let errorHeatmap = {};

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playFireSwoosh() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function playSteamExplosion() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const bufferSize = audioCtx.sampleRate * 0.25;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1200, audioCtx.currentTime);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      noise.start();

      const osc = audioCtx.createOscillator();
      const expGain = audioCtx.createGain();
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
      expGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      expGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

      osc.connect(expGain);
      expGain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    function startGame() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      hp = 100; score = 0; levelScore = 0; combo = 0; level = 1; levelHits = 0; isPlaying = true;
      totalKeystrokes = 0; correctKeystrokes = 0; errorHeatmap = {};
      startTime = Date.now();
      activeTarget = null;
      lastSpawnedWord = "";
      clearCanvasElements();

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('level-up-screen').style.display = 'none';
      document.getElementById('gameover-screen').style.display = 'none';
      document.getElementById('boss-container').style.display = 'none';

      updateHUD();
      resetSpawning();
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(updateGame, 30);
    }

    function clearCanvasElements() {
      enemies.forEach(e => e.el.remove());
      waterSpells.forEach(s => s.el.remove());
      enemies = [];
      waterSpells = [];
      activeTarget = null;
    }

    function resetSpawning() {
      if (spawnInterval) clearInterval(spawnInterval);
      const spawnTime = Math.max(1600, 2600 - (level * 200));
      spawnInterval = setInterval(spawnEnemy, spawnTime);
    }

    function setupBossStage() {
      const bossUI = document.getElementById('boss-container');
      bossUI.style.display = 'flex';
      maxBossHp = level === 4 ? 120 : 180;
      bossHp = maxBossHp;
      updateBossHPBar();
    }

    function updateBossHPBar() {
      const fill = document.getElementById('boss-hp-fill');
      const pct = Math.max(0, (bossHp / maxBossHp) * 100);
      fill.style.width = pct + '%';
    }

    function spawnEnemy() {
      if (!isPlaying) return;
      const maxEnemies = 2;
      if (enemies.length >= maxEnemies) return;

      const pool = levelKeyPool[level];
      let word = pool[Math.floor(Math.random() * pool.length)];

      if (pool.length > 1) {
        while (word === lastSpawnedWord) {
          word = pool[Math.floor(Math.random() * pool.length)];
        }
      }
      lastSpawnedWord = word;

      const canvas = document.getElementById('game-canvas');
      const x = Math.floor(Math.random() * (canvas.clientWidth - 160)) + 10;

      const el = document.createElement('div');
      el.className = 'fireball-container';
      el.innerHTML = `
        <div class="fire-tail"></div>
        <div class="fireball-head">${word}</div>
      `;
      el.style.left = x + 'px';
      el.style.top = '0px';
      canvas.appendChild(el);

      playFireSwoosh();
      enemies.push({ word, typedIndex: 0, x, y: 0, speed: 0.4 + (level * 0.06), el });
    }

    function renderWordProgress(enemy) {
      const headEl = enemy.el.querySelector('.fireball-head');
      const typed = enemy.word.substring(0, enemy.typedIndex);
      const remaining = enemy.word.substring(enemy.typedIndex);
      // 空白字元特別可視化
      const displayTyped = typed.replace(/ /g, '␣');
      const displayRemaining = remaining.replace(/ /g, '␣');
      headEl.innerHTML = `<span class="typed-char">${displayTyped}</span>${displayRemaining}`;
    }

    function shootWaterOrb(targetX, targetY, targetEnemy) {
      const canvas = document.getElementById('game-canvas');
      const staffContainer = document.getElementById('mage-staff-container');
      
      const staffX = canvas.clientWidth / 2;
      const staffY = canvas.clientHeight - 30;

      const angleRad = Math.atan2(targetY - staffY, (targetX + 30) - staffX);
      const angleDeg = (angleRad * 180 / Math.PI) + 90;
      staffContainer.style.transform = `rotate(${angleDeg}deg)`;

      const el = document.createElement('div');
      el.className = 'water-orb';
      el.style.left = staffX + 'px';
      el.style.top = staffY + 'px';
      canvas.appendChild(el);

      waterSpells.push({
        x: staffX,
        y: staffY,
        targetEnemy: targetEnemy,
        el: el
      });
    }

    function createExplosion(x, y) {
      const canvas = document.getElementById('game-canvas');
      const exp = document.createElement('div');
      exp.className = 'explosion';
      exp.style.left = x + 'px';
      exp.style.top = y + 'px';
      canvas.appendChild(exp);
      setTimeout(() => exp.remove(), 300);
    }

    function getStageRankTitle(lvl, curScore) {
      let baseJob = "元素使";
      if (lvl === 3) baseJob = "魔導士";
      else if (lvl >= 4) baseJob = "大賢者";

      const currentAcc = totalKeystrokes > 0 ? (correctKeystrokes / totalKeystrokes) * 100 : 100;

      let rankTier = "🌱 初級";
      if (curScore >= 280 && currentAcc >= 95) rankTier = "👑 神級";
      else if (curScore >= 230 && currentAcc >= 88) rankTier = "🔥 王級";
      else if (curScore >= 170 && currentAcc >= 80) rankTier = "⚔️ 上級";
      else if (curScore >= 110 && currentAcc >= 70) rankTier = "📜 中級";

      return `${rankTier}${baseJob}`;
    }

    function triggerLevelUp(nextLvl, desc) {
      isPlaying = false;
      clearInterval(gameInterval);
      clearInterval(spawnInterval);
      clearCanvasElements();

      const rankTitle = getStageRankTitle(level, levelScore);

      document.getElementById('rank-title-text').innerText = `恭喜獲得：${rankTitle}`;
      document.getElementById('level-up-desc').innerText = desc;
      document.getElementById('level-up-screen').style.display = 'flex';

      level = nextLvl;
      levelHits = 0;
      levelScore = 0;
      if (level >= 4) setupBossStage();
      updateHUD();
    }

    function resumeNextLevel() {
      document.getElementById('level-up-screen').style.display = 'none';
      isPlaying = true;
      resetSpawning();
      gameInterval = setInterval(updateGame, 30);
    }

    function updateGame() {
      if (!isPlaying) return;
      const canvasHeight = document.getElementById('game-canvas').clientHeight;

      for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y += e.speed;
        e.el.style.top = e.y + 'px';

        if (e.y >= canvasHeight - 65) {
          hp -= 10;
          combo = 0;
          if (activeTarget === e) activeTarget = null;
          playSteamExplosion();
          createExplosion(e.x + 30, canvasHeight - 20);
          e.el.remove();
          enemies.splice(i, 1);
          updateHUD();

          if (hp <= 0) gameOver(false);
        }
      }

      for (let i = waterSpells.length - 1; i >= 0; i--) {
        let s = waterSpells[i];
        const target = s.targetEnemy;

        if (!enemies.includes(target)) {
          s.el.remove();
          waterSpells.splice(i, 1);
          continue;
        }

        const targetX = target.x + 30;
        const targetY = target.y + 40;
        const dx = targetX - s.x;
        const dy = targetY - s.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 25) {
          s.el.remove();
          waterSpells.splice(i, 1);

          createExplosion(targetX, targetY);
          playSteamExplosion();

          const eIdx = enemies.indexOf(target);
          if (eIdx !== -1) {
            if (activeTarget === target) activeTarget = null;
            target.el.remove();
            enemies.splice(eIdx, 1);
            combo++;
            levelHits++;
            const earned = 15 + combo * 3;
            score += earned;
            levelScore += earned;

            if (level >= 4) {
              bossHp -= 25;
              updateBossHPBar();
            }

            updateHUD();

            if (levelHits >= 12 && level === 1) {
              triggerLevelUp(2, "你已熟練 Home Row 基準鍵！準備進入 Stage 2 挑戰上排字母（QWERTYUIOP）！");
              return;
            } else if (levelHits >= 12 && level === 2) {
              triggerLevelUp(3, "上排字母掌控完美！準備進入 Stage 3 挑戰下排字母（ZXCVBNM）！");
              return;
            } else if (levelHits >= 12 && level === 3) {
              triggerLevelUp(4, "三排指法基礎完全扎實！準備進入 Stage 4 魔龍討伐戰（高階專有名詞詠唱）！");
              return;
            } else if (bossHp <= 0 && level === 4) {
              triggerLevelUp(5, "成功將魔龍擊退！準備迎接 Stage 5 終極魔龍組合咒語試煉（Cumulonimbus, Icicle Edge 等）！");
              return;
            } else if (bossHp <= 0 && level === 5) {
              gameOver(true);
              return;
            }
          }
        } else {
          s.x += (dx / dist) * 25;
          s.y += (dy / dist) * 25;
          s.el.style.left = s.x + 'px';
          s.el.style.top = s.y + 'px';
        }
      }
    }

    function updateHUD() {
      document.getElementById('hp-val').innerText = Math.max(0, hp);
      document.getElementById('score-val').innerText = score;
      document.getElementById('level-val').innerText = level + '/5';

      const elapsedTimeInMin = (Date.now() - startTime) / 60000;
      const wpm = elapsedTimeInMin > 0 ? Math.round((correctKeystrokes / 5) / elapsedTimeInMin) : 0;
      const acc = totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 100;

      document.getElementById('wpm-val').innerText = wpm;
      document.getElementById('acc-val').innerText = acc + '%';
    }

    function gameOver(win) {
      isPlaying = false;
      clearInterval(gameInterval);
      clearInterval(spawnInterval);
      clearCanvasElements();

      const screen = document.getElementById('gameover-screen');
      const elapsedTimeInMin = (Date.now() - startTime) / 60000;
      const finalWpm = elapsedTimeInMin > 0 ? Math.round((correctKeystrokes / 5) / elapsedTimeInMin) : 0;
      const finalAcc = totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 100;

      const finalRankTitle = getStageRankTitle(level, levelScore);

      if (win) {
        document.getElementById('end-title').innerText = '🎉 試煉成功！';
        document.getElementById('end-desc').innerHTML = `
          完美討伐魔龍！<br>
          最終評定位階：<b style="color:var(--text-gold); font-size: 20px;">${finalRankTitle}</b><br>
        `;
      } else {
        document.getElementById('end-title').innerText = '💀 試煉失敗';
        document.getElementById('end-desc').innerHTML = `
          當前關卡評定：<b style="color:var(--text-gold); font-size: 18px;">${finalRankTitle}</b><br>
          <span style="color:#ef4444; font-size:12px;">高階咒語錯字率偏高，請提升盲打精準度！</span>
        `;
      }

      let heatmapHtml = `<b>平均速度:</b> ${finalWpm} WPM | <b>準確率:</b> ${finalAcc}%<br>`;
      const sortedErrors = Object.keys(errorHeatmap).sort((a,b) => errorHeatmap[b] - errorHeatmap[a]);

      if (sortedErrors.length > 0) {
        heatmapHtml += `<b>高頻易錯鍵熱點 (Heatmap):</b> `;
        sortedErrors.slice(0, 4).forEach(k => {
          heatmapHtml += `<span class="heatmap-tag">${k} (${errorHeatmap[k]}次)</span>`;
        });
      } else {
        heatmapHtml += `<span style="color:#22c55e;">完美表現！未出現明顯易錯按鍵。</span>`;
      }

      document.getElementById('heatmap-content').innerHTML = heatmapHtml;
      screen.style.display = 'flex';
    }

    function cancelActiveTarget() {
      if (activeTarget) {
        activeTarget.typedIndex = 0;
        renderWordProgress(activeTarget);
        activeTarget = null;
      }
    }

    function handleKeyPress(k) {
      if (!isPlaying) return;
      
      const inputChar = (level <= 3) ? k.toUpperCase() : k.toLowerCase();
      totalKeystrokes++;
      
      const keyIdChar = inputChar.toUpperCase();
      const elementId = keyIdChar === ';' ? 'key-semicolon' : `key-${keyIdChar}`;
      const keyEl = document.getElementById(elementId);
      if (keyEl) {
        keyEl.classList.add('active');
        setTimeout(() => keyEl.classList.remove('active'), 120);
      }

      if (activeTarget && enemies.includes(activeTarget)) {
        const expectedChar = activeTarget.word[activeTarget.typedIndex];
        if (inputChar === expectedChar) {
          correctKeystrokes++;
          activeTarget.typedIndex++;
          renderWordProgress(activeTarget);

          if (activeTarget.typedIndex >= activeTarget.word.length) {
            shootWaterOrb(activeTarget.x, activeTarget.y, activeTarget);
            activeTarget = null;
          }
        } else {
          errorHeatmap[expectedChar] = (errorHeatmap[expectedChar] || 0) + 1;
          combo = 0;
          score = Math.max(0, score - 10);
          levelScore = Math.max(0, levelScore - 10);
        }
        updateHUD();
        return;
      }

      const targetEnemy = enemies.find(e => e.word[e.typedIndex] === inputChar);
      if (targetEnemy) {
        correctKeystrokes++;
        targetEnemy.typedIndex++;
        renderWordProgress(targetEnemy);

        if (targetEnemy.typedIndex >= targetEnemy.word.length) {
          shootWaterOrb(targetEnemy.x, targetEnemy.y, targetEnemy);
        } else {
          activeTarget = targetEnemy;
        }
      } else {
        errorHeatmap[inputChar] = (errorHeatmap[inputChar] || 0) + 1;
        combo = 0;
        score = Math.max(0, score - 10);
        levelScore = Math.max(0, levelScore - 10);
      }
      updateHUD();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Delete' || e.key === 'Backspace') {
        cancelActiveTarget();
        return;
      }
      let key = e.key;
      if (e.key === ';') key = ';';
      else if (e.key === ' ') key = ' ';
      handleKeyPress(key);
    });

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('next-level-btn').addEventListener('click', resumeNextLevel);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    initKeyboard();
  </script>
</body>
</html>
