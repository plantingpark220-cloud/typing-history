<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpellCraft Typing 鍵盤魔導士</title>
  <style>
    :root {
      --bg-color: #0d0e15;
      --panel-bg: rgba(22, 26, 42, 0.85);
      --border-gold: #c9a050;
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --text-gold: #fef08a;
      --text-main: #f1f5f9;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #090a0f 70%);
      padding: 10px;
    }
    header {
      width: 100%;
      max-width: 900px;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 2px solid var(--border-gold);
      border-radius: 12px 12px 0 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .title { font-size: 16px; font-weight: bold; color: var(--text-gold); text-shadow: 0 0 10px rgba(201,160,80,0.5); }
    .hud { display: flex; gap: 12px; font-size: 14px; }
    .hud-val { color: var(--accent-blue); font-weight: bold; }
    #game-canvas {
      width: 100%;
      max-width: 900px;
      height: 360px;
      background: rgba(10, 12, 24, 0.85);
      border-left: 2px solid var(--border-gold);
      border-right: 2px solid var(--border-gold);
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
    }

    #mage-staff-container {
      position: absolute;
      bottom: -10px;
      left: 50%;
      width: 60px;
      height: 100px;
      margin-left: -30px;
      z-index: 5;
      transform-origin: bottom center;
      transition: transform 0.15s ease-out;
      pointer-events: none;
    }
    .staff-orb {
      width: 24px;
      height: 24px;
      background: radial-gradient(circle, #e0f2fe 10%, #0284c7 60%, #0369a1 100%);
      border-radius: 50%;
      position: absolute;
      top: 10px;
      left: 18px;
      box-shadow: 0 0 15px #38bdf8, 0 0 25px #0284c7;
      animation: orbGlow 1.5s infinite alternate;
    }
    .staff-head {
      width: 40px;
      height: 35px;
      border: 3px solid #334155;
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      position: absolute;
      top: 5px;
      left: 10px;
      box-shadow: inset 0 0 5px #000;
    }
    .staff-handle {
      width: 6px;
      height: 65px;
      background: linear-gradient(to bottom, #1e293b, #0f172a);
      position: absolute;
      top: 35px;
      left: 27px;
      border-radius: 3px;
    }

    @keyframes orbGlow {
      from { box-shadow: 0 0 10px #38bdf8; }
      to { box-shadow: 0 0 22px #38bdf8, 0 0 30px #60a5fa; }
    }

    .fireball-container {
      position: absolute;
      width: 50px;
      height: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .fire-tail {
      width: 20px;
      height: 30px;
      background: linear-gradient(to top, rgba(249, 115, 22, 0.9), rgba(239, 68, 68, 0.6), transparent);
      border-radius: 50% 50% 20% 20%;
      filter: blur(2px);
      animation: flameFlicker 0.2s infinite alternate;
      margin-bottom: -10px;
    }
    .fireball-head {
      width: 46px;
      height: 46px;
      background: radial-gradient(circle, #fff7ed 10%, #f97316 50%, #dc2626 90%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      color: #0f172a;
      box-shadow: 0 0 15px #f97316, 0 0 30px #ef4444;
      border: 2px solid #ffedd5;
      text-shadow: 0 0 5px #fff;
      z-index: 2;
    }

    @keyframes flameFlicker {
      0% { transform: scaleX(0.9) scaleY(1); opacity: 0.8; }
      100% { transform: scaleX(1.1) scaleY(1.2); opacity: 1; }
    }

    .water-orb {
      position: absolute;
      width: 22px;
      height: 22px;
      background: radial-gradient(circle, #ffffff 20%, #38bdf8 60%, #0284c7 100%);
      border-radius: 50%;
      box-shadow: 0 0 15px #38bdf8, 0 0 25px #0284c7;
      z-index: 4;
      pointer-events: none;
    }

    .explosion {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #38bdf8 40%, #f97316 70%, transparent 100%);
      transform: translate(-50%, -50%) scale(0.2);
      animation: explode 0.3s ease-out forwards;
      pointer-events: none;
      z-index: 6;
    }

    @keyframes explode {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
      50% { opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
    }

    .keyboard {
      width: 100%;
      max-width: 900px;
      background: var(--panel-bg);
      border: 2px solid var(--border-gold);
      border-radius: 0 0 12px 12px;
      padding: 10px 5px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .key-row { display: flex; justify-content: center; gap: 4px; }
    .key {
      flex: 1;
      max-width: 45px;
      height: 45px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(201,160,80,0.4);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      color: #94a3b8;
      transition: all 0.1s ease;
      cursor: pointer;
    }
    .key.active {
      background: var(--border-gold);
      color: #000;
      box-shadow: 0 0 15px var(--text-gold);
      transform: scale(0.92);
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 14, 21, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      z-index: 10;
    }
    .btn {
      padding: 12px 32px;
      background: linear-gradient(135deg, #c9a050, #8e5225);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(201,160,80,0.4);
      transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <header>
    <div class="title">✨ SpellCraft Typing</div>
    <div class="hud">
      <div>HP: <span id="hp-val" class="hud-val" style="color:var(--danger);">100</span></div>
      <div>分: <span id="score-val" class="hud-val">0</span></div>
      <div>連擊: <span id="combo-val" class="hud-val">0x</span></div>
      <div>關: <span id="level-val" class="hud-val">1/4</span></div>
    </div>
  </header>

  <div id="game-canvas">
    <div id="mage-staff-container">
      <div class="staff-head"></div>
      <div class="staff-orb"></div>
      <div class="staff-handle"></div>
    </div>
    
    <div id="start-screen" class="overlay">
      <h1 style="color: var(--text-gold); font-size: 24px;">魔法學院鍵盤試煉</h1>
      <p style="color: #94a3b8; font-size: 13px; text-align: center; padding: 0 20px;">
        揮舞水元素法杖擊退烈焰火球！<br><b>Stage 1： Home Row 基準鍵特訓（ASDFGHJKL;）</b>
      </p>
      <button class="btn" id="start-btn">開始詠唱試煉</button>
    </div>

    <div id="level-up-screen" class="overlay" style="display: none;">
      <h1 style="color: #38bdf8; font-size: 24px;">✨ 關卡突破！</h1>
      <p style="color: #fef08a; font-size: 18px; margin-top: 5px;" id="rank-title-text">恭喜獲得稱號：📜 【初階元素使】</p>
      <p style="color: #94a3b8; font-size: 14px; text-align: center; max-width: 80%;" id="level-up-desc"></p>
      <button class="btn" id="next-level-btn">進入下一關</button>
    </div>

    <div id="gameover-screen" class="overlay" style="display: none;">
      <h1 id="end-title" style="color: var(--text-gold); font-size: 24px;">試煉結果</h1>
      <p id="end-desc" style="color: #94a3b8; font-size: 15px; text-align: center;"></p>
      <button class="btn" id="restart-btn">重新嘗試</button>
    </div>
  </div>

  <div class="keyboard" id="virtual-keyboard"></div>

  <script>
    const keysLayout = [
      ["Q","W","E","R","T","Y","U","I","O","P"],
      ["A","S","D","F","G","H","J","K","L",";"],
      ["Z","X","C","V","B","N","M"]
    ];

    const levelKeyPool = {
      1: "ASDFGHJKL;",                   // Stage 1: 中排基準鍵
      2: "QWERTYUIOP",                    // Stage 2: 上排字母
      3: "ZXCVBNM",                       // Stage 3: 下排字母
      4: "ABCDEFGHIJKLMNOPQRSTUVWXYZ;"    // Stage 4: 終極全字母試煉
    };

    function initKeyboard() {
      const container = document.getElementById('virtual-keyboard');
      container.innerHTML = '';
      keysLayout.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'key-row';
        row.forEach(k => {
          const keyDiv = document.createElement('div');
          keyDiv.className = 'key';
          keyDiv.id = `key-${k === ';' ? 'semicolon' : k}`;
          keyDiv.innerText = k;

          const handleInput = (e) => {
            e.preventDefault();
            handleKeyPress(k);
          };
          keyDiv.addEventListener('touchstart', handleInput, { passive: false });
          keyDiv.addEventListener('click', handleInput);

          rowDiv.appendChild(keyDiv);
        });
        container.appendChild(rowDiv);
      });
    }

    let hp = 100, score = 0, combo = 0, level = 1, isPlaying = false;
    let enemies = [];
    let waterSpells = [];
    let gameInterval = null, spawnInterval = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playFireSwoosh() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function playSteamExplosion() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const bufferSize = audioCtx.sampleRate * 0.25;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1200, audioCtx.currentTime);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      noise.start();

      const osc = audioCtx.createOscillator();
      const expGain = audioCtx.createGain();
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
      expGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      expGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

      osc.connect(expGain);
      expGain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    function startGame() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      hp = 100; score = 0; combo = 0; level = 1; isPlaying = true;
      clearCanvasElements();

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('level-up-screen').style.display = 'none';
      document.getElementById('gameover-screen').style.display = 'none';
      updateHUD();

      resetSpawning();
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(updateGame, 30);
    }

    function clearCanvasElements() {
      enemies.forEach(e => e.el.remove());
      waterSpells.forEach(s => s.el.remove());
      enemies = [];
      waterSpells = [];
    }

    function resetSpawning() {
      if (spawnInterval) clearInterval(spawnInterval);
      const spawnTime = Math.max(1200, 2200 - (level * 250));
      spawnInterval = setInterval(spawnEnemy, spawnTime);
    }

    function spawnEnemy() {
      if (!isPlaying) return;
      const maxEnemies = Math.min(level + 1, 3);
      if (enemies.length >= maxEnemies) return;

      const chars = levelKeyPool[level];
      const char = chars[Math.floor(Math.random() * chars.length)];
      const canvas = document.getElementById('game-canvas');
      const x = Math.floor(Math.random() * (canvas.clientWidth - 60)) + 10;

      const el = document.createElement('div');
      el.className = 'fireball-container';
      el.innerHTML = `
        <div class="fire-tail"></div>
        <div class="fireball-head">${char}</div>
      `;
      el.style.left = x + 'px';
      el.style.top = '0px';
      canvas.appendChild(el);

      playFireSwoosh();
      enemies.push({ char, x, y: 0, speed: 0.75 + (level * 0.2), el });
    }

    function shootWaterOrb(targetX, targetY, targetEnemy) {
      const canvas = document.getElementById('game-canvas');
      const staffContainer = document.getElementById('mage-staff-container');
      
      const staffX = canvas.clientWidth / 2;
      const staffY = canvas.clientHeight - 30;

      const angleRad = Math.atan2(targetY - staffY, (targetX + 25) - staffX);
      const angleDeg = (angleRad * 180 / Math.PI) + 90;
      staffContainer.style.transform = `rotate(${angleDeg}deg)`;

      const el = document.createElement('div');
      el.className = 'water-orb';
      el.style.left = staffX + 'px';
      el.style.top = staffY + 'px';
      canvas.appendChild(el);

      waterSpells.push({
        x: staffX,
        y: staffY,
        targetEnemy: targetEnemy,
        el: el
      });
    }

    function createExplosion(x, y) {
      const canvas = document.getElementById('game-canvas');
      const exp = document.createElement('div');
      exp.className = 'explosion';
      exp.style.left = x + 'px';
      exp.style.top = y + 'px';
      canvas.appendChild(exp);
      setTimeout(() => exp.remove(), 300);
    }

    function triggerLevelUp(nextLvl, rankName, desc) {
      isPlaying = false;
      clearInterval(gameInterval);
      clearInterval(spawnInterval);
      clearCanvasElements();

      document.getElementById('rank-title-text').innerText = `恭喜獲得稱號：${rankName}`;
      document.getElementById('level-up-desc').innerText = desc;
      document.getElementById('level-up-screen').style.display = 'flex';

      level = nextLvl;
      updateHUD();
    }

    function resumeNextLevel() {
      document.getElementById('level-up-screen').style.display = 'none';
      isPlaying = true;
      resetSpawning();
      gameInterval = setInterval(updateGame, 30);
    }

    function updateGame() {
      if (!isPlaying) return;
      const canvasHeight = document.getElementById('game-canvas').clientHeight;

      for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y += e.speed;
        e.el.style.top = e.y + 'px';

        if (e.y >= canvasHeight - 65) {
          hp -= 10;
          combo = 0;
          playSteamExplosion();
          createExplosion(e.x + 25, canvasHeight - 20);
          e.el.remove();
          enemies.splice(i, 1);
          updateHUD();

          if (hp <= 0) gameOver(false);
        }
      }

      for (let i = waterSpells.length - 1; i >= 0; i--) {
        let s = waterSpells[i];
        const target = s.targetEnemy;

        if (!enemies.includes(target)) {
          s.el.remove();
          waterSpells.splice(i, 1);
          continue;
        }

        const targetX = target.x + 25;
        const targetY = target.y + 40;
        const dx = targetX - s.x;
        const dy = targetY - s.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 25) {
          s.el.remove();
          waterSpells.splice(i, 1);

          createExplosion(targetX, targetY);
          playSteamExplosion();

          const eIdx = enemies.indexOf(target);
          if (eIdx !== -1) {
            target.el.remove();
            enemies.splice(eIdx, 1);
            combo++;
            score += 10 + combo * 2;
            updateHUD();

            if (score >= 300 && level === 1) {
              triggerLevelUp(2, "📜【初階元素使】", "你已徹底熟練 Home Row 中排基準鍵！準備進入 Stage 2 挑戰上排字母（QWERTYUIOP）！");
              return;
            } else if (score >= 700 && level === 2) {
              triggerLevelUp(3, "⚔️【大符文導師】", "上排字母掌控完美！準備進入 Stage 3 挑戰下排字母（ZXCVBNM）！");
              return;
            } else if (score >= 1200 && level === 3) {
              triggerLevelUp(4, "🔮【高階魔法使】", "太出色了！三排指法皆已過關，準備迎接 Stage 4 全字母隨機終極試煉（目標 2000 分）！");
              return;
            } else if (score >= 2000 && level === 4) {
              gameOver(true);
              return;
            }
          }
        } else {
          s.x += (dx / dist) * 25;
          s.y += (dy / dist) * 25;
          s.el.style.left = s.x + 'px';
          s.el.style.top = s.y + 'px';
        }
      }
    }

    function updateHUD() {
      document.getElementById('hp-val').innerText = hp;
      document.getElementById('score-val').innerText = score;
      document.getElementById('combo-val').innerText = combo + 'x';
      document.getElementById('level-val').innerText = level + '/4';
    }

    function gameOver(win) {
      isPlaying = false;
      clearInterval(gameInterval);
      clearInterval(spawnInterval);
      clearCanvasElements();

      const screen = document.getElementById('gameover-screen');

      if (win) {
        document.getElementById('end-title').innerText = '🎉 試煉成功！';
        document.getElementById('end-desc').innerHTML = `
          完美突破四大關卡！<br>
          獲得最高榮譽稱號：<b style="color:var(--text-gold); font-size: 22px;">👑 【大賢者】</b><br><br>
          最終得分：${score} 分 | 最高連擊：${combo}x
        `;
      } else {
        let failRank = "🌱 見習學徒";
        if (score >= 1200) failRank = "🔮 高階魔法使";
        else if (score >= 700) failRank = "⚔️ 大符文導師";
        else if (score >= 300) failRank = "📜 初階元素使";

        document.getElementById('end-title').innerText = '💀 試煉失敗';
        document.getElementById('end-desc').innerHTML = `
          生命值歸零！<br>
          當前達成稱號：<b style="color:var(--text-gold); font-size: 18px;">${failRank}</b><br><br>
          最終得分：${score} 分 | 最高連擊：${combo}x<br>
          <span style="color:#ef4444; font-size:13px; margin-top:5px; display:inline-block;">未能通關，無法獲得「大賢者」稱號！</span>
        `;
      }
      screen.style.display = 'flex';
    }

    function handleKeyPress(k) {
      if (!isPlaying) return;
      
      const elementId = k === ';' ? 'key-semicolon' : `key-${k}`;
      const keyEl = document.getElementById(elementId);
      if (keyEl) {
        keyEl.classList.add('active');
        setTimeout(() => keyEl.classList.remove('active'), 120);
      }

      const targetEnemy = enemies.find(e => e.char === k);
      if (targetEnemy) {
        shootWaterOrb(targetEnemy.x, targetEnemy.y, targetEnemy);
      } else {
        combo = 0;
        updateHUD();
      }
    }

    window.addEventListener('keydown', (e) => {
      let key = e.key.toUpperCase();
      if (e.key === ';') key = ';';
      handleKeyPress(key);
    });

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('next-level-btn').addEventListener('click', resumeNextLevel);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    initKeyboard();
  </script>
</body>
</html>
