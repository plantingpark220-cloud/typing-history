<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpellCraft Typing 鍵盤魔導士</title>
  <style>
    :root {
      --bg-color: #0d0e15;
      --panel-bg: rgba(22, 26, 42, 0.85);
      --border-gold: #c9a050;
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --text-gold: #fef08a;
      --text-main: #f1f5f9;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #090a0f 70%);
      padding: 10px;
    }
    header {
      width: 100%;
      max-width: 900px;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 2px solid var(--border-gold);
      border-radius: 12px 12px 0 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .title { font-size: 16px; font-weight: bold; color: var(--text-gold); text-shadow: 0 0 10px rgba(201,160,80,0.5); }
    .hud { display: flex; gap: 12px; font-size: 14px; }
    .hud-val { color: var(--accent-blue); font-weight: bold; }
    #game-canvas {
      width: 100%;
      max-width: 900px;
      height: 340px;
      background: rgba(10, 12, 24, 0.8);
      border-left: 2px solid var(--border-gold);
      border-right: 2px solid var(--border-gold);
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
    }
    /* 魔法杖視覺效果 */
    #mage-staff {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      z-index: 5;
      filter: drop-shadow(0 0 10px var(--accent-blue));
    }
    .keyboard {
      width: 100%;
      max-width: 900px;
      background: var(--panel-bg);
      border: 2px solid var(--border-gold);
      border-radius: 0 0 12px 12px;
      padding: 10px 5px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .key-row { display: flex; justify-content: center; gap: 4px; }
    .key {
      flex: 1;
      max-width: 45px;
      height: 45px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(201,160,80,0.4);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      color: #94a3b8;
      transition: all 0.1s ease;
      cursor: pointer;
    }
    .key.active {
      background: var(--border-gold);
      color: #000;
      box-shadow: 0 0 15px var(--text-gold);
      transform: scale(0.92);
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 14, 21, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      z-index: 10;
    }
    .btn {
      padding: 12px 32px;
      background: linear-gradient(135deg, #c9a050, #8e5225);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(201,160,80,0.4);
      transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.95); }
    
    /* 熾熱火球造型 */
    .fireball {
      position: absolute;
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, #fef08a 20%, #f97316 60%, #dc2626 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 22px;
      color: #111;
      box-shadow: 0 0 20px #f97316, 0 0 35px #dc2626;
      border: 2px solid #ffedd5;
      text-shadow: 0 0 4px #fff;
      transition: top 0.1s linear;
    }
    /* 魔法光束粒子 */
    .magic-spell {
      position: absolute;
      width: 10px;
      height: 25px;
      background: linear-gradient(to top, #38bdf8, #ffffff);
      border-radius: 5px;
      box-shadow: 0 0 15px #38bdf8, 0 0 25px #c084fc;
      z-index: 4;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">✨ SpellCraft Typing</div>
    <div class="hud">
      <div>HP: <span id="hp-val" class="hud-val" style="color:var(--danger);">100</span></div>
      <div>分: <span id="score-val" class="hud-val">0</span></div>
      <div>連擊: <span id="combo-val" class="hud-val">0x</span></div>
      <div>關: <span id="level-val" class="hud-val">1/3</span></div>
    </div>
  </header>

  <div id="game-canvas">
    <div id="mage-staff">🔮🪄</div>
    
    <div id="start-screen" class="overlay">
      <h1 style="color: var(--text-gold); font-size: 24px;">魔法學院鍵盤試煉</h1>
      <p style="color: #94a3b8; font-size: 13px; text-align: center; padding: 0 20px;">
        詠唱咒語，從法杖發射魔法抵銷墜落的火球！<br>關卡 1：基準鍵 ASDF JKL
      </p>
      <button class="btn" id="start-btn">開始詠唱試煉</button>
    </div>
    <div id="gameover-screen" class="overlay" style="display: none;">
      <h1 id="end-title" style="color: var(--text-gold); font-size: 24px;">試煉結果</h1>
      <p id="end-desc" style="color: #94a3b8; font-size: 15px; text-align: center;"></p>
      <button class="btn" id="restart-btn">重新嘗試</button>
    </div>
  </div>

  <div class="keyboard" id="virtual-keyboard"></div>

  <script>
    const keysLayout = [
      ["Q","W","E","R","T","Y","U","I","O","P"],
      ["A","S","D","F","G","H","J","K","L"],
      ["Z","X","C","V","B","N","M"]
    ];

    const levelKeyPool = {
      1: "ASDFJKL",
      2: "ASDFJKLQWERTYUIOP",
      3: "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
    };

    function initKeyboard() {
      const container = document.getElementById('virtual-keyboard');
      container.innerHTML = '';
      keysLayout.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'key-row';
        row.forEach(k => {
          const keyDiv = document.createElement('div');
          keyDiv.className = 'key';
          keyDiv.id = `key-${k}`;
          keyDiv.innerText = k;

          const handleInput = (e) => {
            e.preventDefault();
            handleKeyPress(k);
          };
          keyDiv.addEventListener('touchstart', handleInput, { passive: false });
          keyDiv.addEventListener('click', handleInput);

          rowDiv.appendChild(keyDiv);
        });
        container.appendChild(rowDiv);
      });
    }

    let hp = 100, score = 0, combo = 0, level = 1, isPlaying = false;
    let enemies = [];
    let spells = [];
    let gameInterval = null, spawnInterval = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function startGame() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      hp = 100; score = 0; combo = 0; level = 1; isPlaying = true;
      enemies.forEach(e => e.el.remove());
      spells.forEach(s => s.el.remove());
      enemies = [];
      spells = [];

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('gameover-screen').style.display = 'none';
      updateHUD();

      resetSpawning();
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(updateGame, 30);
    }

    function resetSpawning() {
      if (spawnInterval) clearInterval(spawnInterval);
      const spawnTime = Math.max(800, 2200 - (level * 500));
      spawnInterval = setInterval(spawnEnemy, spawnTime);
    }

    function spawnEnemy() {
      if (!isPlaying) return;
      const maxEnemies = level + 2; 
      if (enemies.length >= maxEnemies) return;

      const chars = levelKeyPool[level];
      const char = chars[Math.floor(Math.random() * chars.length)];
      const canvas = document.getElementById('game-canvas');
      const x = Math.floor(Math.random() * (canvas.clientWidth - 60)) + 10;

      const el = document.createElement('div');
      el.className = 'fireball';
      el.innerText = char;
      el.style.left = x + 'px';
      el.style.top = '0px';
      canvas.appendChild(el);

      enemies.push({ char, x, y: 0, speed: 1.0 + (level * 0.4), el });
    }

    function shootSpell(targetX, targetY, targetIndex) {
      const canvas = document.getElementById('game-canvas');
      const staffX = canvas.clientWidth / 2;
      const staffY = canvas.clientHeight - 20;

      const el = document.createElement('div');
      el.className = 'magic-spell';
      el.style.left = staffX + 'px';
      el.style.top = staffY + 'px';
      canvas.appendChild(el);

      spells.push({
        x: staffX,
        y: staffY,
        targetX: targetX + 20,
        targetY: targetY + 20,
        targetIndex: targetIndex,
        el: el
      });
    }

    function updateGame() {
      if (!isPlaying) return;
      const canvasHeight = document.getElementById('game-canvas').clientHeight;

      // 更新火球下降
      for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y += e.speed;
        e.el.style.top = e.y + 'px';

        if (e.y >= canvasHeight - 50) {
          hp -= 10;
          combo = 0;
          playBeep(150, 0.2);
          e.el.remove();
          enemies.splice(i, 1);
          updateHUD();

          if (hp <= 0) gameOver(false);
        }
      }

      // 更新魔法光束飛行與抵銷
      for (let i = spells.length - 1; i >= 0; i--) {
        let s = spells[i];
        const dx = s.targetX - s.x;
        const dy = s.targetY - s.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 20) {
          // 相撞抵銷！爆炸消除火球
          s.el.remove();
          spells.splice(i, 1);

          const targetEnemy = enemies[s.targetIndex];
          if (targetEnemy) {
            playBeep(600, 0.1);
            targetEnemy.el.remove();
            enemies.splice(s.targetIndex, 1);
            combo++;
            score += 10 + combo * 2;

            let oldLevel = level;
            if (score >= 180 && level === 2) level = 3;
            else if (score >= 80 && level === 1) level = 2;

            if (oldLevel !== level) resetSpawning();
            if (score >= 300) gameOver(true);

            updateHUD();
          }
        } else {
          s.x += (dx / dist) * 22; // 飛向火球的速度
          s.y += (dy / dist) * 22;
          s.el.style.left = s.x + 'px';
          s.el.style.top = s.y + 'px';
        }
      }
    }

    function updateHUD() {
      document.getElementById('hp-val').innerText = hp;
      document.getElementById('score-val').innerText = score;
      document.getElementById('combo-val').innerText = combo + 'x';
      document.getElementById('level-val').innerText = level + '/3';
    }

    function gameOver(win) {
      isPlaying = false;
      clearInterval(gameInterval);
      clearInterval(spawnInterval);

      let rank = "📜 見習詠唱者";
      if (score >= 300) rank = "👑 傳奇鍵盤魔導士";
      else if (score >= 180) rank = "⚔️ 大符文導師";
      else if (score >= 80) rank = "🔮 初階元素使";

      const screen = document.getElementById('gameover-screen');
      document.getElementById('end-title').innerText = win ? '🎉 試煉成功！' : '💀 試煉失敗';
      document.getElementById('end-desc').innerHTML = `
        獲得稱號：<b style="color:var(--text-gold); font-size: 18px;">${rank}</b><br><br>
        最終得分：${score} 分 | 連擊：${combo}x
      `;
      screen.style.display = 'flex';
    }

    function handleKeyPress(k) {
      if (!isPlaying) return;
      const keyEl = document.getElementById(`key-${k}`);
      if (keyEl) {
        keyEl.classList.add('active');
        setTimeout(() => keyEl.classList.remove('active'), 120);
      }

      const index = enemies.findIndex(e => e.char === k);
      if (index !== -1) {
        // 從法杖發射魔法光束飛向該火球
        shootSpell(enemies[index].x, enemies[index].y, index);
      } else {
        combo = 0;
        updateHUD();
      }
    }

    window.addEventListener('keydown', (e) => {
      handleKeyPress(e.key.toUpperCase());
    });

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    initKeyboard();
  </script>
</body>
</html>
