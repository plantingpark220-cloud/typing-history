<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpellCraft Typing 鍵盤魔導士</title>
  <style>
    :root {
      --bg-color: #0d0e15;
      --panel-bg: rgba(22, 26, 42, 0.85);
      --border-gold: #c9a050;
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --text-gold: #fef08a;
      --text-main: #f1f5f9;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      background-image: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #090a0f 70%);
    }
    header {
      width: 100%;
      max-width: 900px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 2px solid var(--border-gold);
      border-radius: 0 0 16px 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      margin-bottom: 10px;
    }
    .title { font-size: 20px; font-weight: bold; color: var(--text-gold); text-shadow: 0 0 10px rgba(201,160,80,0.5); }
    .hud { display: flex; gap: 20px; font-size: 14px; }
    .hud-val { color: var(--accent-blue); font-weight: bold; }
    #game-canvas {
      width: 900px;
      height: 380px;
      background: rgba(10, 12, 24, 0.6);
      border: 2px solid rgba(201,160,80,0.3);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
    }
    .keyboard {
      background: var(--panel-bg);
      border: 2px solid var(--border-gold);
      border-radius: 16px 16px 0 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
      margin-top: 10px;
    }
    .key-row { display: flex; justify-content: center; gap: 6px; }
    .key {
      width: 42px;
      height: 42px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(201,160,80,0.4);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: #94a3b8;
      transition: all 0.1s ease;
    }
    .key.active {
      background: var(--border-gold);
      color: #000;
      box-shadow: 0 0 12px var(--text-gold);
      transform: scale(0.95);
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 14, 21, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10;
    }
    .btn {
      padding: 12px 28px;
      background: linear-gradient(135deg, #c9a050, #8e5225);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(201,160,80,0.3);
      transition: transform 0.2s;
    }
    .btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>

  <header>
    <div class="title">✨ SpellCraft Typing：鍵盤魔導士</div>
    <div class="hud">
      <div>生命值: <span id="hp-val" class="hud-val" style="color:#ef4444;">100</span></div>
      <div>分數: <span id="score-val" class="hud-val">0</span></div>
      <div>連擊: <span id="combo-val" class="hud-val">0x</span></div>
      <div>關卡: <span id="level-val" class="hud-val">1/3</span></div>
    </div>
  </header>

  <div id="game-canvas">
    <div id="start-screen" class="overlay">
      <h1 style="color: var(--text-gold);">魔法學院鍵盤試煉</h1>
      <p style="color: #94a3b8;">詠唱正確的符文與咒語，擊退進犯的魔物！</p>
      <button class="btn" onclick="startGame()">開始詠唱試煉</button>
    </div>
    <div id="gameover-screen" class="overlay" style="display: none;">
      <h1 id="end-title" style="color: var(--text-gold);">試煉結果</h1>
      <p id="end-desc" style="color: #94a3b8;"></p>
      <button class="btn" onclick="startGame()">重新嘗試</button>
    </div>
  </div>

  <div class="keyboard" id="virtual-keyboard"></div>

  <script>
    const keysLayout = [
      ["Q","W","E","R","T","Y","U","I","O","P"],
      ["A","S","D","F","G","H","J","K","L"],
      ["Z","X","C","V","B","N","M"]
    ];
    
    function initKeyboard() {
      const container = document.getElementById('virtual-keyboard');
      container.innerHTML = '';
      keysLayout.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'key-row';
        row.forEach(k => {
          const keyDiv = document.createElement('div');
          keyDiv.className = 'key';
          keyDiv.id = `key-${k}`;
          keyDiv.innerText = k;
          rowDiv.appendChild(keyDiv);
        });
        container.appendChild(rowDiv);
      });
    }

    let hp = 100, score = 0, combo = 0, level = 1, isPlaying = false;
    let targets = [];

    function startGame() {
      hp = 100; score = 0; combo = 0; level = 1; isPlaying = true;
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('gameover-screen').style.display = 'none';
      updateHUD();
      spawnLoop();
    }

    function updateHUD() {
      document.getElementById('hp-val').innerText = hp;
      document.getElementById('score-val').innerText = score;
      document.getElementById('combo-val').innerText = combo + 'x';
      document.getElementById('level-val').innerText = level + '/3';
    }

    function spawnLoop() {
      if (!isPlaying) return;
      // 遊戲主邏輯簡化展示
      updateHUD();
    }

    window.addEventListener('keydown', (e) => {
